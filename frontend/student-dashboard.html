<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 14v2m0 0v2m0-2h2m-2 0H10"/>
                        <path d="M3 12h18M3 12a9 9 0 0118 0 9 9 0 01-18 0z"/>
                    </svg>
                </div>
                <h2>SMS</h2>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-section="dashboard">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-section="announcements">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 01-3.46 0"/>
                    </svg>
                    <span>Announcements</span>
                </a>
                <a href="#" class="nav-item" data-section="notes">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <span>Notes</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">
                    <div class="user-avatar">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <div class="user-details">
                        <span class="user-name" id="userName">Student</span>
                        <span class="user-role" id="userRole">student</span>
                    </div>
                </div>
                <button class="btn btn-logout" id="logoutButton">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Overlay for mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1 id="sectionTitle">Dashboard</h1>
                <div class="header-actions">
                    <button class="btn btn-icon mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                </div>
            </header>

            <div class="content-body">
                <!-- Dashboard Section -->
                <section class="section active" id="dashboardSection">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon announcements-icon">
                                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                    <path d="M13.73 21a2 2 0 01-3.46 0"/>
                                </svg>
                            </div>
                            <div class="stat-info">
                                <span class="stat-value" id="announcementCount">0</span>
                                <span class="stat-label">Announcements</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon notes-icon">
                                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                </svg>
                            </div>
                            <div class="stat-info">
                                <span class="stat-value" id="noteCount">0</span>
                                <span class="stat-label">Available Notes</span>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Announcements -->
                    <div class="card">
                        <div class="card-header">
                            <h3>Recent Announcements</h3>
                            <a href="#" class="card-link" data-navigate="announcements">View All</a>
                        </div>
                        <div class="card-body">
                            <div class="announcement-list" id="recentAnnouncements">
                                <div class="empty-state">
                                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                        <path d="M13.73 21a2 2 0 01-3.46 0"/>
                                    </svg>
                                    <p>No announcements yet</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Notes -->
                    <div class="card">
                        <div class="card-header">
                            <h3>Recent Notes</h3>
                            <a href="#" class="card-link" data-navigate="notes">View All</a>
                        </div>
                        <div class="card-body">
                            <div class="notes-grid" id="recentNotes">
                                <div class="empty-state">
                                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                    </svg>
                                    <p>No notes available yet</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Announcements Section -->
                <section class="section" id="announcementsSection">
                    <div class="card">
                        <div class="card-header">
                            <h3>All Announcements</h3>
                        </div>
                        <div class="card-body">
                            <div class="announcement-list" id="allAnnouncements">
                                <div class="empty-state">
                                    <p>No announcements yet</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Notes Section -->
                <section class="section" id="notesSection">
                    <div class="card">
                        <div class="card-header">
                            <h3>Available Notes</h3>
                        </div>
                        <div class="card-body">
                            <div class="notes-grid" id="allNotes">
                                <div class="empty-state">
                                    <p>No notes available yet</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
